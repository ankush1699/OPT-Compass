# docker compose up -d db          just the database (local development, port 5433 on this machine only)
# docker compose up -d --build     database + the service on http://localhost:8000 (API_PORT=8010 to change the port)
# Settings come from the repo-root .env (never committed); the database address is set here.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compass}
      POSTGRES_DB: compass
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./rag-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://compass:${POSTGRES_PASSWORD:-compass}@db:5432/compass
      # Also readable from .env; set here so `DEMO_ENABLED=1 docker compose up` works without editing it.
      DEMO_ENABLED: ${DEMO_ENABLED:-0}
      STATS_KEY: ${STATS_KEY:-}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

volumes:
  pgdata:
